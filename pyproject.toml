[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localagent"
version = "0.1.0"
description = "Provider-agnostic agentic software factory with a pluggable self-improvement (paper) slot; ships MASS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localagent = "localagent.cli:main"

[tool.setuptools.packages.find]
include = ["localagent*"]
